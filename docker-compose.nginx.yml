version: "3.8"

services:
  app:
    image: tengrinews-backend:local
    build:
      context: .
      dockerfile: dockerfiles/backend.Dockerfile
    env_file:
      - backend/.env.prod
    environment:
      - TENGRI_ENV_ID=prod
    command: daphne -b 0.0.0.0 -p 8000 settings.asgi:application
    depends_on:
      - postgres
      - redis
    expose:
      - "8000"

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
