services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres} -h 127.0.0.1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 2
      start_period: 5s
    volumes:
      - pgdata:/var/lib/postgresql/data

  
  backend:
    build:
      context: .
      dockerfile: dockerfiles/backend.Dockerfile
    working_dir: /backend
    volumes:
      - ./backend:/backend
      - static_volume:/backend/static
      - media_volume:/backend/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: dockerfiles/backend.Dockerfile
    working_dir: /backend
    command: daphne -b 0.0.0.0 -p 8000 settings.asgi:application
    volumes:
      - static_volume:/backend/static
      - media_volume:/backend/media
      - ./backend:/backend
    expose:
      - "8000"
    restart: unless-stopped
    depends_on:
      - postgres
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 2
      start_period: 5s

  celery_worker:
    build:
      context: .
      dockerfile: dockerfiles/backend.Dockerfile
    working_dir: /backend
    command: celery -A settings.celery:app worker --loglevel=info
    volumes:
      - ./backend:/backend
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  celery_beat:
    build:
      context: .
      dockerfile: dockerfiles/backend.Dockerfile
    working_dir: /backend
    command: celery -A settings.celery:app beat --loglevel=info
    volumes:
      - ./backend:/backend
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/var/www/static:ro
      - media_volume:/var/www/media:ro
    restart: unless-stopped

volumes:
  pgdata:
  static_volume:
  media_volume:
