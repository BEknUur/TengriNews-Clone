services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-myuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mypassword}
      POSTGRES_DB: ${POSTGRES_DB:-mydatabase}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-myuser} -d ${POSTGRES_DB:-mydatabase}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - appnet

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - redisdata:/data
    networks:
      - appnet

  backend:
    build:
      context: .
      dockerfile: dockerfiles/backend.Dockerfile
    image: tengrinews-backend:dev
    restart: unless-stopped
    env_file:
      - .env
    command: daphne -b 0.0.0.0 -p 8000 settings.asgi:application
    environment:
      TENGRI_ENV_ID: ${TENGRI_ENV_ID:-prod}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PYTHONPATH: /app
      DJANGO_LOG_DIR: /tmp/tengri-logs
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,212.109.223.106}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1,http://212.109.223.106:81}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1,http://212.109.223.106:81}
      POSTGRESQL_URL: ${POSTGRESQL_URL:-postgres://${POSTGRES_USER:-myuser}:${POSTGRES_PASSWORD:-mypassword}@postgres:5432/${POSTGRES_DB:-mydatabase}}
      COLLECT_STATIC: ${COLLECT_STATIC:-0}
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
      - static_volume:/app/static
      - media_volume:/app/media
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H 'Host: localhost' http://127.0.0.1:8000/healthz >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - appnet

  celery_worker:
    image: tengrinews-backend:dev
    build:
      context: .
      dockerfile: dockerfiles/backend.Dockerfile
    restart: unless-stopped
    command: celery -A settings.celery:app worker --loglevel=info
    env_file:
      - .env
    environment:
      TENGRI_ENV_ID: ${TENGRI_ENV_ID:-prod}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PYTHONPATH: /app
      DJANGO_LOG_DIR: /tmp/tengri-logs
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,212.109.223.106}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1,http://212.109.223.106:81}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1,http://212.109.223.106:81}
      POSTGRESQL_URL: ${POSTGRESQL_URL:-postgres://${POSTGRES_USER:-myuser}:${POSTGRES_PASSWORD:-mypassword}@postgres:5432/${POSTGRES_DB:-mydatabase}}
      COLLECT_STATIC: 0
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      disable: true
    networks:
      - appnet

  celery_beat:
    image: tengrinews-backend:dev
    build:
      context: .
      dockerfile: dockerfiles/backend.Dockerfile
    restart: unless-stopped
    command: celery -A settings.celery:app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    env_file:
      - .env
    environment:
      TENGRI_ENV_ID: ${TENGRI_ENV_ID:-prod}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PYTHONPATH: /app
      DJANGO_LOG_DIR: /tmp/tengri-logs
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,212.109.223.106}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1,http://212.109.223.106:81}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1,http://212.109.223.106:81}
      POSTGRESQL_URL: ${POSTGRESQL_URL:-postgres://${POSTGRES_USER:-myuser}:${POSTGRES_PASSWORD:-mypassword}@postgres:5432/${POSTGRES_DB:-mydatabase}}
      COLLECT_STATIC: 0
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      disable: true
    networks:
      - appnet

  frontend:
    image: node:22-alpine
    working_dir: /frontend
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    restart: unless-stopped
    volumes:
      - ./frontend:/frontend
      - frontend_node_modules:/frontend/node_modules
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:5173 >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - appnet

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "81:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/var/www/static:ro
      - media_volume:/var/www/media:ro
    networks:
      - appnet

volumes:
  pgdata:
  redisdata:
  static_volume:
  media_volume:
  backend_venv:
  frontend_node_modules:

networks:
  appnet:
    driver: bridge
