services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres} -h 127.0.0.1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 2
      start_period: 5s
    volumes:
      - pgdata:/var/lib/postgresql/data

  
  backend:
    build:
      context: .
      dockerfile: dockerfiles/backend.Dockerfile
    working_dir: /backend
    volumes:
      - ./backend:/backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 2
      start_period: 5s

  celery_worker:
    build:
      context: .
      dockerfile: dockerfiles/backend.Dockerfile
    working_dir: /backend
    command: celery -A settings.celery:app worker --loglevel=info
    volumes:
      - ./backend:/backend
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  celery_beat:
    build:
      context: .
      dockerfile: dockerfiles/backend.Dockerfile
    working_dir: /backend
    command: celery -A settings.celery:app beat --loglevel=info
    volumes:
      - ./backend:/backend
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  pgdata:
