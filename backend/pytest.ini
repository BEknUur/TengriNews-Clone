[pytest]
DJANGO_SETTINGS_MODULE = settings.env.test
python_files = tests.py test_*.py *_tests.py
addopts = -q --strict-markers --tb=short --maxfail=1 --disable-warnings --cov=apps --cov-report=term-missing --cov-report=xml:backend/reports/coverage.xml
markers =
    slow: slow tests
    integration: integration tests
    celery: celery tasks