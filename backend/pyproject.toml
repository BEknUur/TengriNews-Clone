[project]
name = "tengrinews-clone"
version = "0.0.1"
description = "TengriNews Clone"
authors = [{ name = "Turarbek Sataldiyev", email = "turarbeks@bk.ru" }]
requires-python = ">=3.12"
dependencies = [
    "dj-database-url>=3.1.1",
    "django==5.0",
    "django-cors-headers>=4.9.0",
    "django-filter>=24.3",
    "django-unfold>=0.80.1",
    "djangorestframework>=3.16.1",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.27.2",
    "gunicorn>=25.1.0",
    "pillow>=12.1.1",
    "psycopg2-binary>=2.9.11",
    "python-decouple>=3.8",
    "whitenoise>=6.11.0",
    "pytest>=8.0",
    "pytest-django>=4.9",
    "faker>=24.0.0",
    "django-extensions>=3.2.0",
    "pygraphviz>=1.14",
    "redis>=7.4.0",
    "django-redis>=6.0.0",
    "celery>=5.6.3",
    "daphne>=4.1.2",
    "channels>=4.2.0",
    "channels-redis>=4.2.1",
]
[tool.setuptools]
packages = ["apps", "settings"]
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "settings.env.local"
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
